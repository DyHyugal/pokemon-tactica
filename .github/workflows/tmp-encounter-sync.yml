name: Temporary encounter sync

on:
  push:
    branches:
      - chore/cohesion-cleanup-2026-09-26

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[encounter-sync-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/cohesion-cleanup-2026-09-26
          fetch-depth: 0
      - name: Regenerate runtime and wiki from canonical encounters
        run: |
          python3 tools/sync_tactica_encounters.py
          python3 tools/validate_tactica_encounter_evolutions.py
          python3 tools/sync_tactica_localization.py
          python3 tools/sync_tactica_encounter_access.py --check
          python3 tools/sync_tactica_encounters.py --check
          python3 tools/sync_tactica_localization.py --check
          python3 tools/validate_tactica_spec.py
      - name: Commit generated outputs
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/wild_encounters.json \
                  wiki/FR/Localisations.md wiki/EN/Locations.md \
                  docs/FR/Localisations.md docs/EN/Locations.md \
                  docs/FR/Localisations.html docs/EN/Locations.html \
                  wiki/FR/Pokedex.md wiki/EN/Pokedex.md \
                  docs/FR/Pokedex.md docs/EN/Pokedex.md \
                  docs/FR/Pokedex.html docs/EN/Pokedex.html
          git commit -m "Encounter data: regenerate runtime and wiki [encounter-sync-bot]"
          git push origin HEAD:chore/cohesion-cleanup-2026-09-26
