name: Tactica validation
on:
  push:
    branches: [main, integration/v1]
  pull_request:
    branches: [main, integration/v1]
  workflow_dispatch:
    inputs:
      exhaustive_trainers:
        description: 'Also run all 3792 trainer/map/difficulty/story combinations'
        type: boolean
        default: false
permissions:
  contents: read

jobs:
  hns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Classify validation scope
        id: scope
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            BASE="origin/${{ github.base_ref }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BASE="${{ github.event.before }}"
          else
            BASE=""
          fi

          ARGS=()
          if [ -n "$BASE" ] && git rev-parse "$BASE" >/dev/null 2>&1; then
            ARGS+=(--base "$BASE")
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ARGS+=(--full)
          fi
          python3 tools/tactica_test_plan.py "${ARGS[@]}" --github-output "$GITHUB_OUTPUT"

      - name: Validate documentation index
        run: .github/docs_validate/inclusive_summary.py

      - name: Validate localized documentation
        if: steps.scope.outputs.data != 'true'
        run: python3 tools/validate_tactica_localization.py

      - name: Documentation-only validation complete
        if: steps.scope.outputs.data != 'true'
        run: |
          echo "Documentation-only change: toolchain, ROM build and gameplay regression suites intentionally skipped."

      - name: Install build dependencies
        if: steps.scope.outputs.data == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3 python3-pil

      - name: Validate Tactica engine data
        if: steps.scope.outputs.data == 'true'
        run: |
          python3 tools/validate_tactica_spec.py
          python3 tools/validate_tactica_encounter_evolutions.py
          python3 -m unittest discover -s tools/tests -p 'test_tactica_*.py'
          python3 tools/validate_tactica_evolutions.py
          python3 tools/validate_family_remix.py
          python3 tools/validate_tactica_balance.py
          python3 tools/validate_tactica_mega.py
          python3 tools/validate_tactica_boss_sets.py
          python3 tools/audit_tactica_trainer_scaling.py
          python3 tools/sync_tactica_encounter_access.py --check
          python3 tools/sync_tactica_encounters.py --check
          python3 tools/sync_tactica_special_encounters.py --check
          python3 tools/sync_tactica_species_evolutions.py --check
          python3 tools/sync_tactica_species_balance.py --check
          python3 tools/sync_tactica_trainer_levels.py --check
          python3 tools/sync_tactica_localization.py --check
          python3 tools/sync_tactica_boss_wiki.py --check
          python3 tools/sync_tactica_wiki_assets.py --check
          python3 tools/sync_tactica_bosses.py --check
          python3 tools/sync_tactica_rival_parties.py --check
          python3 tools/generate_tactica_rival.py --check
          python3 tools/sync_tactica_mega_shop.py --check
          python3 tools/sync_tactica_move_shop.py --check

      - name: Build HnS
        if: steps.scope.outputs.build == 'true'
        run: make hns -j2

      - name: Reviewed native regression suites
        if: steps.scope.outputs.suites != ''
        env:
          SELECTED_SUITES: ${{ steps.scope.outputs.suites }}
          EXHAUSTIVE: ${{ inputs.exhaustive_trainers }}
        shell: bash
        run: |
          EXTRA=()
          if [ "$EXHAUSTIVE" = "true" ]; then
            EXTRA+=(--exhaustive)
          fi
          python3 tools/run_tactica_tests.py --suites $SELECTED_SUITES --jobs 2 "${EXTRA[@]}"

      - name: Validate Tactica UI assets
        if: steps.scope.outputs.data == 'true'
        run: |
          python3 tools/validate_tactica_ui.py
          python3 tools/validate_tactica_localization.py

      - name: Preserve native regression evidence
        if: always() && steps.scope.outputs.suites != ''
        uses: actions/upload-artifact@v4
        with:
          name: tactica-native-test-results
          path: test-results/
          if-no-files-found: warn
